; Scoped pytest config for the whole suite (`pytest tests`): pure protocol tests and the
; real-Home-Assistant tests in tests/ha. It lives in tests/ so it applies to `pytest tests`
; without touching anything at the repository root.
[pytest]
; pytest-homeassistant-custom-component's fixtures are async; the HA core suite itself runs in
; auto mode and pytest-asyncio 1.x refuses to run them without this.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
; `custom_components` lives one level above this file.
pythonpath = ..
norecursedirs = __pycache__ snapshots frontend node_modules
