<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pawfly aquarium light">
  <title>Pawfly</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F4A5C"/>
      <stop offset="1" stop-color="#061B2C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEE"/>
      <stop offset="1" stop-color="#E6D9BD"/>
    </linearGradient>
    <linearGradient id="cone" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="206">
      <stop offset="0" stop-color="#D4FFFA" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4FD8DA" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="clip"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#plate)"/>
  <rect width="256" height="256" rx="56" fill="url(#sheen)"/>
  <g clip-path="url(#clip)">
    <!-- bloom under the bar and pooled around the fish -->
    <ellipse cx="128" cy="66" rx="62" ry="18" fill="#FFF1CF" fill-opacity="0.47" filter="url(#soft)"/>
    <!-- light cone -->
    <path d="M94 60 L162 60 L212 206 L44 206 Z" fill="url(#cone)" filter="url(#edge)"/>
    <ellipse cx="128" cy="186" rx="76" ry="30" fill="#5FE9E4" fill-opacity="0.47" filter="url(#soft)"/>
    <!-- fish: leaf-shaped body + forked triangular tail -->
    <path d="M58.0 186.0 L62.3 179.1 L66.7 174.8 L71.0 171.3 L75.3 168.5 L79.7 166.2 L84.0 164.5 L88.3 163.2 L92.7 162.4 L97.0 162.1 L101.3 162.0 L105.7 162.4 L110.0 163.1 L114.3 164.0 L118.7 165.2 L123.0 166.7 L127.3 168.4 L131.7 170.2 L136.0 172.3 L140.3 174.4 L144.7 176.6 L149.0 178.9 L153.3 181.3 L157.7 183.6 L162.0 186.0 L162.0 186.0 L157.7 188.4 L153.3 190.7 L149.0 193.1 L144.7 195.4 L140.3 197.6 L136.0 199.7 L131.7 201.8 L127.3 203.6 L123.0 205.3 L118.7 206.8 L114.3 208.0 L110.0 208.9 L105.7 209.6 L101.3 210.0 L97.0 209.9 L92.7 209.6 L88.3 208.8 L84.0 207.5 L79.7 205.8 L75.3 203.5 L71.0 200.7 L66.7 197.2 L62.3 192.9 L58.0 186.0 Z" fill="#C9FBF7"/>
    <path d="M148.0 186.0 L198.0 160.0 L188.0 186.0 L198.0 212.0 Z" fill="#C9FBF7"/>
    <circle cx="80" cy="182" r="4.6" fill="#082B3A"/>
    <!-- LED bar: R, G, B, W -->
    <rect x="48" y="30" width="160" height="28" rx="14" fill="url(#bar)"/>
    <circle cx="74" cy="44" r="10.5" fill="#082533"/>
    <circle cx="74" cy="44" r="6.6" fill="#FF4B4B"/>
    <circle cx="110" cy="44" r="10.5" fill="#082533"/>
    <circle cx="110" cy="44" r="6.6" fill="#35DC7E"/>
    <circle cx="146" cy="44" r="10.5" fill="#082533"/>
    <circle cx="146" cy="44" r="6.6" fill="#3D86FF"/>
    <circle cx="182" cy="44" r="10.5" fill="#082533"/>
    <circle cx="182" cy="44" r="6.6" fill="#FFFFFF"/>
  </g>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="55.25" fill="none" stroke="#5FE3E0" stroke-opacity="0.27" stroke-width="1.5"/>
</svg>
